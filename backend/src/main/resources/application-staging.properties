# Staging Profile Configuration for AgroRental Backend
# Server Configuration
server.port=${PORT:${SERVER_PORT:8080}}

# Database Configuration (MySQL only, strictly supplied through environment variables - no fallbacks)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Console strictly disabled in staging
spring.h2.console.enabled=false

# Staging JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Staging Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

# Staging Logging Configuration
logging.level.root=INFO
logging.level.com.agrorental=INFO
logging.level.org.hibernate.SQL=WARN

# Staging Seeding Safety Configuration: Mock Data Seeding is strictly disabled in staging
agrorental.seed.mock-data.enabled=false
agrorental.operator.seed.default-password=
agrorental.admin.seed.email=${AGRORENTAL_ADMIN_EMAIL:}
agrorental.admin.seed.password=${AGRORENTAL_ADMIN_PASSWORD:}


# Staging CORS Safety Configuration: Explicit HTTPS origins must be provided via APP_CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Staging OTP Safety Configuration: Mock OTP disclosure is strictly disabled
app.otp.include-dev-mock=false

# Staging JWT Authentication Configuration: Secret must be provided via JWT_SECRET
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION_MS:3600000}
