spring.application.name=demo
# Server Port
server.port=8080

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/agro_rental_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=agro_user
spring.datasource.password=agropassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Operator OTP Configuration
operator.otp.expiry-minutes=5
operator.otp.resend-cooldown-seconds=60

# Operator Documents Upload Configuration
app.upload.operator-docs-dir=uploads/operator_documents
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# JWT Security Configuration
jwt.secret=AgroRentalPlatformSuperSecretJwtKey2026MustBeAtLeast32BytesLongForHmacSha256
jwt.expiration-hours=24

