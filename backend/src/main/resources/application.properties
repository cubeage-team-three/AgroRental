spring.application.name=demo
# Server Port
server.port=8080

# Database Connection (MySQL Database)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/agro_rental_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:@Kartik_6391}

# JPA / Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Authentication Configuration
app.jwt.secret=${JWT_SECRET:agrorental-super-secret-jwt-key-for-development-mode-only-must-be-256-bits-minimum-change-in-prod}
app.jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# Operator Module Configuration
agrorental.operator.seed.default-password=${OPERATOR_SEED_PASSWORD:Operator@123}