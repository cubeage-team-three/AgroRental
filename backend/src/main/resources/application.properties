spring.application.name=demo
# Server Port
server.port=8080

# Database Connection (H2 In-Memory DB for easy local dev/run, easily switchable to MySQL)
spring.datasource.url=jdbc:h2:mem:agro_rental_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Authentication Configuration
app.jwt.secret=${JWT_SECRET:agrorental-super-secret-jwt-key-for-development-mode-only-must-be-256-bits-minimum-change-in-prod}
app.jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# Operator Module Configuration
agrorental.operator.seed.default-password=${OPERATOR_SEED_PASSWORD:Operator@123}