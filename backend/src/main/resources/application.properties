spring.application.name=demo
# Server Port
server.port=${PORT:${SERVER_PORT:8080}}

# Default Spring Profile for local development
spring.profiles.default=dev

# Database Connection (H2 In-Memory DB for easy local dev/run, automatically switches to MySQL when SPRING_DATASOURCE_URL is set)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:agro_rental_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration Configuration
# Disabled by default on default H2 in-memory databases (local dev / tests)
spring.flyway.enabled=false

# JWT Authentication Configuration
# No default fallback - JWT_SECRET must be explicitly provided via environment variable
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# CORS Allowed Origins Configuration (Overridden per environment profile)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# Startup Mock Data Seeding (Disabled by default; opt-in only)
agrorental.seed.mock-data.enabled=${AGRORENTAL_SEED_MOCK_DATA_ENABLED:false}

# Operator and Admin Module Configuration
agrorental.admin.seed.email=${AGRORENTAL_ADMIN_EMAIL:agrorent@admin.in}
agrorental.admin.seed.password=${AGRORENTAL_ADMIN_PASSWORD:agrorent21}
agrorental.operator.seed.default-password=${OPERATOR_SEED_PASSWORD:Operator@123}
app.otp.expiry-minutes=5
app.otp.max-attempts=3
app.otp.resend-cooldown-seconds=30
app.otp.include-dev-mock=${APP_OTP_INCLUDE_DEV_MOCK:false}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads
