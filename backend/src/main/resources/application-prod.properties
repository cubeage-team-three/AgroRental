# Production Profile Configuration for AgroRental Backend
# Server Configuration
server.port=${PORT:${SERVER_PORT:8080}}

# Database Configuration (Overrides development connection via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/agro_rental_db?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agro_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:agropassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Production JPA & Hibernate Safety Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Production Flyway Database Migration Configuration
spring.flyway.enabled=true

# Production Logging Configuration
logging.level.root=INFO
logging.level.com.agrorental=INFO
logging.level.org.hibernate.SQL=WARN

# Production Seeding Safety Configuration: Mock Data Seeding is strictly disabled in production
agrorental.seed.mock-data.enabled=false

# Production CORS Safety Configuration: Explicit HTTPS origins must be provided via APP_CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# Production OTP Safety Configuration: Mock OTP disclosure is strictly disabled
app.otp.include-dev-mock=false

# Production JWT Authentication Configuration: Secret must be provided via JWT_SECRET
app.jwt.secret=${JWT_SECRET:}
