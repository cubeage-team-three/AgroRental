# Development Profile Configuration for AgroRental Backend
#
# Local development must activate this profile EXPLICITLY, for example:
#   SPRING_PROFILES_ACTIVE=dev JWT_SECRET=<32+ chars> ./mvnw spring-boot:run
# The implicit default (spring.profiles.default=dev) still loads this file, but the conveniences
# below (mock data, mock OTP display, H2 console) stay off unless 'dev' is explicitly active, and
# startup is refused if an external database (e.g. MySQL) is configured without an explicit profile.
#
# Seed credentials have no defaults; set them only if you want seeded accounts:
#   AGRORENTAL_ADMIN_PASSWORD  - seeds the initial admin account (AGRORENTAL_ADMIN_EMAIL optional)
#   OPERATOR_SEED_PASSWORD     - seeds the mock operator accounts (otherwise they are skipped)

# Explicit development configuration: mock data seeding enabled
agrorental.seed.mock-data.enabled=true

# H2 web console (localhost only) for the in-memory development database
spring.h2.console.enabled=true

# Development CORS Configuration: local development frontend origins
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174

# Development OTP Configuration: allow dev mock OTP in responses for local development/testing
app.otp.include-dev-mock=true

# Password reset dev token disclosure: OFF by default even in dev. Opt in per run with
# APP_PASSWORD_RESET_DEV_TOKEN_IN_RESPONSE=true (requires SPRING_PROFILES_ACTIVE=dev).
app.password-reset.dev-token-in-response=${APP_PASSWORD_RESET_DEV_TOKEN_IN_RESPONSE:false}

# Development JWT Configuration: secret must be provided via JWT_SECRET environment variable
app.jwt.secret=${JWT_SECRET:}
