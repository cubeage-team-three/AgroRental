name: Auto PR and Merge

on:
  push:
    branches-ignore:
      - development
      - testing
      - production

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create PR if none exists
        id: pr
        run: |
          existing=$(gh pr list --head "${{ github.ref_name }}" --base development --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create --base development --head "${{ github.ref_name }}" \
              --title "Merge ${{ github.ref_name }} into development" \
              --body "Auto-created PR for branch ${{ github.ref_name }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: |
          number=$(gh pr list --head "${{ github.ref_name }}" --base development --json number --jq '.[0].number')
          gh pr merge "$number" --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
